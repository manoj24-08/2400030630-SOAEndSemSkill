server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: driver-service-route
          uri: lb://driver-service
          predicates:
            - Path=/drivers/**
    discovery:
      client:
        simple:
          instances:
            driver-service:
              - uri: http://localhost:8081
                metadata:
                  instance: Driver-1
              - uri: http://localhost:8082
                metadata:
                  instance: Driver-2
              - uri: http://localhost:8083
                metadata:
                  instance: Driver-3

logging:
  level:
    org.springframework.cloud.loadbalancer: INFO
    org.springframework.cloud.gateway: INFO
